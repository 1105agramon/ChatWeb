<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Privado</title>
    <link rel="stylesheet" href="chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        
        <!-- PANEL IZQUIERDO: Lista de Chats -->
        <!-- Se le agrega el id "sidebar" para controlarlo desde JS en móviles -->
        <aside class="sidebar" id="sidebar">
            <header class="sidebar-header">
                <div class="mi-perfil">
                    <div class="avatar"><i class="fa-solid fa-user"></i></div>
                    <span id="mi-nombre-perfil">Cargando...</span>
                </div>
                
                <!-- NUEVO: Menú desplegable -->
                <div class="header-actions" style="position: relative;">
                    <button class="btn-icon" onclick="toggleMenuDesplegable()" title="Opciones">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                    
                    <!-- Opciones del menú -->
                    <div id="menu-opciones" class="dropdown-menu hidden">
                        <div class="dropdown-item" onclick="abrirModalPerfil()">
                            <i class="fa-solid fa-user-pen"></i> Editar Perfil
                        </div>
                        <div class="dropdown-item" onclick="abrirModalSeguridad()">
                            <i class="fa-solid fa-shield-halved"></i> Seguridad
                        </div>
                        <div class="dropdown-divider"></div>
                        <div class="dropdown-item text-danger" onclick="cerrarSesion()">
                            <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
                        </div>
                    </div>
                </div>
            </header>
            
            <!-- Buscador para iniciar nuevo chat -->
            <div class="search-container">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="buscar-numero" placeholder="Buscar por número (Ej: 5551234)">
                    <button class="btn-icon-small" onclick="iniciarNuevoChat()">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>

            <!-- Lista dinámica de conversaciones -->
            <div id="lista-conversaciones" class="chat-list">
                <!-- Se llena con JS -->
            </div>
        </aside>

        <!-- PANEL DERECHO: Área de Mensajes -->
        <!-- Se le agrega el id "chat-area" para controlarlo desde JS en móviles -->
        <main class="chat-area" id="chat-area">
            
            <!-- Estado inicial cuando no hay chat seleccionado -->
            <div id="pantalla-vacia" class="empty-state active">
                <i class="fa-solid fa-comments"></i>
                <h2>Chat Privado Web</h2>
                <p>Selecciona un chat para comenzar a enviar mensajes.</p>
            </div>

            <!-- Chat activo -->
            <div id="pantalla-activa" class="active-chat hidden">
                <header class="chat-header">
                    <!-- NUEVO: Botón de atrás (solo visible en móviles) -->
                    <button class="btn-icon btn-back-mobile" onclick="volverAListaChats()">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div class="contacto-info">
                        <div class="avatar"><i class="fa-solid fa-user"></i></div>
                        <div class="detalles-contacto">
                            <h3 id="nombre-chat-activo">Nombre Contacto</h3>
                        </div>
                    </div>
                </header>

                <div id="historial-mensajes" class="messages-container">
                    <!-- Los globos de chat se generan aquí -->
                </div>

                <footer class="chat-footer">
                    <!-- Banner flotante de edición -->
                    <div id="banner-edicion" class="edit-banner hidden">
                        <div class="edit-banner-content">
                            <i class="fa-solid fa-pen"></i>
                            <span>Editando mensaje</span>
                        </div>
                        <button class="btn-icon-small" onclick="cancelarEdicion()"><i class="fa-solid fa-xmark"></i></button>
                    </div>

                    <!-- Fila principal alineada horizontalmente -->
                    <div class="footer-main-row">
                        <input type="file" id="input-imagen" accept="image/*" style="display: none;" onchange="mostrarVistaPrevia()">
                        <button class="btn-icon" onclick="document.getElementById('input-imagen').click()">
                            <i class="fa-solid fa-paperclip"></i>
                        </button>
                        
                        <div class="input-wrapper">
                            <span id="nombre-archivo-preview" class="file-preview hidden"></span>
                            <input type="text" id="input-texto" placeholder="Escribe un mensaje aquí...">
                        </div>
                        
                        <button class="btn-icon btn-send" onclick="enviarMensaje()">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </footer>
            </div>
        </main>
    </div>

    <!-- MODAL / VENTANA FLOTANTE PARA VISUALIZAR IMÁGENES -->
    <div id="modal-imagen" class="image-modal hidden">
        <span class="modal-close" onclick="cerrarModalImagen()">&times;</span>
        <img class="modal-content" id="img-ampliada" alt="Vista previa ampliada">
    </div>

    <!-- TOAST NOTIFICACIÓN (Flotante) -->
    <div id="toast-notificacion" class="toast hidden">
        <div class="toast-icon"><i class="fa-solid fa-bell"></i></div>
        <div class="toast-content">
            <h4 id="toast-titulo">Nuevo Mensaje</h4>
            <p id="toast-cuerpo">Tienes un nuevo mensaje esperando.</p>
        </div>
    </div>
    <!-- MINI MODAL FLOTANTE -->
    <div id="mini-modal" class="mini-modal-overlay hidden">
        <div class="mini-modal-box">
            <p id="mini-modal-text" class="mini-modal-text">Mensaje aquí</p>
            <div class="mini-modal-actions">
                <button id="mini-btn-no" class="mini-btn mini-btn-cancel">NO</button>
                <button id="mini-btn-si" class="mini-btn mini-btn-confirm">SÍ</button>
            </div>
        </div>
    </div>

    <!-- MODAL EDITAR PERFIL -->
    <div id="modal-perfil" class="mini-modal-overlay hidden">
        <div class="mini-modal-box" style="width: 320px;">
            <h3 style="margin-bottom: 15px; color: var(--texto-principal);">Editar Perfil</h3>
            
            <div style="text-align: left; margin-bottom: 10px;">
                <label style="font-size: 12px; color: var(--texto-secundario);">Alias / Nombre</label>
                <input type="text" id="edit-alias" class="modal-input" placeholder="Tu nombre">
            </div>
            
            <div style="text-align: left; margin-bottom: 20px;">
                <label style="font-size: 12px; color: var(--texto-secundario);">Número de Celular</label>
                <input type="text" id="edit-telefono" class="modal-input" placeholder="Tu número">
            </div>

            <div class="mini-modal-actions">
                <button class="mini-btn mini-btn-cancel" onclick="cerrarModalPerfil()">Cancelar</button>
                <button class="mini-btn mini-btn-confirm" onclick="guardarPerfil()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- MODAL SEGURIDAD -->
    <div id="modal-seguridad" class="mini-modal-overlay hidden">
        <div class="mini-modal-box" style="width: 340px; max-height: 90vh; overflow-y: auto;">
            <h3 style="margin-bottom: 15px; color: var(--texto-principal);">Seguridad</h3>

            <!-- Contraseña Actual (Obligatoria para cualquier cambio) -->
            <div style="text-align: left; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--color-border);">
                <label style="font-size: 12px; color: var(--acento-principal); font-weight: bold;">Contraseña Actual (Obligatoria)</label>
                <input type="password" id="seg-current-password" class="modal-input" placeholder="Requerida para guardar cambios">
            </div>

            <div style="text-align: left; margin-bottom: 10px;">
                <label style="font-size: 12px; color: var(--texto-secundario);">Nueva Contraseña</label>
                <input type="password" id="seg-new-password" class="modal-input" placeholder="Dejar en blanco para no cambiar">
            </div>

            <div style="text-align: left; margin-bottom: 10px;">
                <label style="font-size: 12px; color: var(--texto-secundario);">Nuevo PIN (4 dígitos)</label>
                <input type="text" id="seg-new-pin" class="modal-input" maxlength="4" placeholder="Dejar en blanco para no cambiar">
            </div>

            <div style="text-align: left; margin-bottom: 10px;">
                <label style="font-size: 12px; color: var(--texto-secundario);">Nueva Pregunta secreta</label>
                <input type="text" id="seg-new-pregunta" class="modal-input" placeholder="Debe incluir ¿ y ?">
            </div>

            <div style="text-align: left; margin-bottom: 20px;">
                <label style="font-size: 12px; color: var(--texto-secundario);">Nueva Respuesta</label>
                <input type="text" id="seg-new-respuesta" class="modal-input" placeholder="Dejar en blanco para no cambiar">
            </div>

            <div class="mini-modal-actions" style="margin-bottom: 15px;">
                <button class="mini-btn mini-btn-cancel" onclick="cerrarModalSeguridad()">Cancelar</button>
                <button class="mini-btn mini-btn-confirm" onclick="guardarSeguridad()">Guardar</button>
            </div>

            <div class="dropdown-divider"></div>
            
            <!-- Botón de peligro para desactivar -->
            <button class="mini-btn" style="background: rgba(251,59,47,0.1); color: var(--acento-principal); width: 100%; margin-top: 10px;" onclick="confirmarDesactivarCuenta()">
                <i class="fa-solid fa-user-slash"></i> Desactivar Cuenta
            </button>
        </div>
    </div>
    
    <!-- Librerías para WebSockets -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    
    <script src="chat.js"></script>
    <script src="perfil.js"></script>
</body>
</html>
