spring.application.name=ChatWEB
# Conexión a MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/chatweb
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuración de Hibernate/JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Aumenta el límite del tamaño de archivos (ejemplo: 10MB para peticiones y archivos individuales)
spring.servlet.multi-part.max-file-size=10MB
spring.servlet.multi-part.max-request-size=10MB


# Desactiva la recarga automática del navegador (LiveReload)
spring.devtools.livereload.enabled=false

# Evita que el servidor interno se reinicie al guardar imágenes
spring.devtools.restart.exclude=static/**, public/**, **/*.jpg, **/*.png, **/*.jpeg